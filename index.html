<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where in the world?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="light">
    <header class="header">
      <div class="container header-inner">
        <h1 class="logo">Where in the world?</h1>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
        >
          <svg
            id="theme-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M12.1 22c-5.5 0-10-4.5-10-10 0-4.4 2.9-8.2 6.9-9.5.4-.1.8 0 1 .3.2.3.2.7 0 1-1 1.5-1.5 3.3-1.5 5.2 0 5 4 9 9 9 .5 0 1 0 1.5-.1.4-.1.7.1.9.4.2.3.1.7-.2 1-1.9 1.9-4.4 2.7-6.6 2.7z"
            />
          </svg>
          <span>Dark Mode</span>
        </button>
      </div>
    </header>

    <main class="container">
      <div id="app" aria-live="polite"></div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
